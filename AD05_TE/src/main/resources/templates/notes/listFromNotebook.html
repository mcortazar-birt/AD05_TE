<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
	<div style="display: flex; gap: 1em; margin-bottom: 1em"> 
	    <svg xmlns="http://www.w3.org/2000/svg" width="4em" height="4em" class="bi bi-square-half" fill="currentColor" viewBox="0 0 16 16" th:style="'color: ' + ${NotebookColorMap.getColor(notebook.color)}">
		  <path d="M8 15V1h6a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1zm6 1a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/>
		</svg>	
	    <h1 th:text="'Notas de '  + ${notebook.getName()}"></h1>
	</div>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <a class="btn btn-primary mb-3" th:href="@{/notes/new/{notebookId}(notebookId=${notebook.id})}">Nueva nota</a>
    <p th:if="${#lists.isEmpty(notes)}" class="alert alert-info">No hay notas para mostrar.</p>
    <div class="table-responsive" th:unless="${#lists.isEmpty(notes)}">
        <table class="table table-striped align-middle">
            <caption>Notas y su cuaderno.</caption>
            <thead><tr><th scope="col">Titulo</th><th scope="col">Contenido</th><th scope="col">Acciones</th></tr></thead>
            <tbody><tr th:each="note : ${notes}">
                <td th:text="${note.title}"></td><td th:text="${note.content}"></td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/notes/{id}/edit(id=${note.id})}">Editar</a>
                    <a class="btn btn-sm btn-outline-danger" th:href="@{/notes/{id}/delete(id=${note.id})}">Eliminar</a>
                </td>
            </tr></tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
